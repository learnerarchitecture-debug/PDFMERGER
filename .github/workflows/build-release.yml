name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application exe
        run: python -m PyInstaller --onefile --windowed --noconfirm --name "PDF Suite Pro" pdf_tool.py

      - name: Build CLI exe
        run: python -m PyInstaller --onefile --console --noconfirm --name "PDFSuiteCLI" pdf_cli.py

      - name: Build installer (NSIS)
        run: |
          choco install nsis -y
          & "C:\Program Files (x86)\NSIS\makensis.exe" pdfsuite_pro.nsi
        shell: pwsh

      - name: Smoke test CLI
        run: |
          dist\PDFSuiteCLI.exe ops
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFSuitePro-v4-Windows
          path: |
            dist/PDF Suite Pro.exe
            dist/PDFSuiteCLI.exe
            PDFSuitePro_Installer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PDF Suite Pro.exe
            dist/PDFSuiteCLI.exe
            PDFSuitePro_Installer.exe
